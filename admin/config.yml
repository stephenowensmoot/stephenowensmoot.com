backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/stephenowensmoot.com
  branch: main
  # Add this when the Cloudflare OAuth worker is deployed:
  # base_url: https://YOUR-AUTH-WORKER.workers.dev

local_backend: true
site_url: https://stephenowensmoot.com
display_url: https://stephenowensmoot.com
logo_url: https://stephenowensmoot.com/assets/favicon.svg
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: website
    label: Website
    files:
      - name: content
        label: Website content
        file: content/site.json
        format: json
        fields:
          - label: Site settings
            name: site
            widget: object
            fields:
              - { label: Professional headline, name: tagline, widget: string }
              - { label: Homepage introduction, name: introduction, widget: text }
              - { label: Public email, name: email, widget: string }
              - { label: Location, name: location, widget: string, required: false }
              - { label: LinkedIn URL, name: linkedin, widget: string, required: false }
              - { label: Google Scholar URL, name: google_scholar, widget: string, required: false }
              - { label: ORCID URL, name: orcid, widget: string, required: false }

          - label: Homepage
            name: home
            widget: object
            fields:
              - { label: Biography heading, name: bio_heading, widget: string }
              - { label: Main biography, name: bio_primary, widget: text }
              - { label: Additional biography, name: bio_secondary, widget: text, required: false }
              - label: Featured work
                name: featured
                widget: list
                max: 3
                fields:
                  - { label: Type, name: type, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Link, name: url, widget: string, required: false }
                  - { label: Link label, name: link_label, widget: string, default: Explore }
              - label: Current focus
                name: current_focus
                widget: list
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: Description, name: text, widget: text }
              - { label: Last updated, name: last_updated, widget: string }

          - label: CV
            name: cv
            widget: object
            fields:
              - { label: Profile, name: profile, widget: text }
              - label: Experience
                name: experience
                widget: list
                fields:
                  - { label: Dates, name: date, widget: string }
                  - { label: Role, name: title, widget: string }
                  - { label: Organization, name: organization, widget: string }
                  - { label: Description, name: description, widget: text, required: false }
              - label: Education
                name: education
                widget: list
                fields:
                  - { label: Date, name: date, widget: string }
                  - { label: Degree, name: degree, widget: string }
                  - { label: Institution, name: institution, widget: string }
                  - { label: Additional detail, name: detail, widget: text, required: false }
              - label: Publications
                name: publications
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Citation, name: citation, widget: string }
              - label: Presentations
                name: presentations
                widget: list
                fields:
                  - { label: Date, name: date, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Venue, name: venue, widget: string }
              - label: Awards and service
                name: awards
                widget: list
                fields:
                  - { label: Date, name: date, widget: string }
                  - { label: Title, name: title, widget: string }

          - label: Projects
            name: projects
            widget: list
            fields:
              - { label: Type, name: type, widget: string }
              - { label: Status or year, name: status, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string }, required: false }
              - { label: Link, name: url, widget: string, required: false }

          - label: Media
            name: media
            widget: list
            fields:
              - label: Category
                name: category
                widget: select
                options: [podcast, interview, lecture]
              - { label: Date, name: date, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Program, host, or venue, name: source, widget: string }
              - { label: Link, name: url, widget: string, required: false }
              - { label: Link label, name: link_label, widget: string, default: Open }

          - label: Contact page
            name: contact
            widget: object
            fields:
              - { label: Introduction, name: introduction, widget: text }
              - label: Inquiry types
                name: inquiry_types
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Description, name: description, widget: text }
